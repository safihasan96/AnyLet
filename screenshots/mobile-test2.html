:root {
  --color-primary: #1a227f;
  --color-bg: #F8F9FA;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFFFF;
  --color-text-main: #0F1117;
  --color-text-muted: #64748b;
  --color-border: #e2e8f0;
}
[data-theme='dark'] {
  --color-bg: #0F1117;
  --color-surface: #1A1D24;
  --color-surface-raised: #222630;
  --color-text-main: #F8F9FA;
  --color-text-muted: #8B8BA7;
  --color-border: #2D323F;
  --dyn-slate-950: #0A0C10;
  --dyn-slate-900: #0F1117;
  --dyn-slate-800: #1A1D24;
  --dyn-slate-700: #2D323F;
}
body {
  font-family: var(--font-sans);
  background-color: var(--color-bg);
  background-image: url('/bg-light.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: var(--color-text-main);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
[data-theme='dark'] body {
  background-color: var(--color-bg);
  background-image: none;
  color: var(--color-text-main);
}
[data-theme='dark'] .app-container {
  filter: none;
}
.no-scrollbar::-webkit-scrollbar {
  display: none;
}
.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
}
[data-theme='dark'] .glass-panel {
  background: rgba(26, 29, 36, 0.6);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-height: 100dvh;

main {
  flex: 1;

/* ── Safe area support for Capacitor / PWA ──────────────────────────────────
   env(safe-area-inset-*) fills the space around the notch, Dynamic Island,
   and the phone's bottom home indicator on all device models.
   viewport-fit=cover (in index.html) lets us paint edge-to-edge and then
   selectively push content back in using these env() values.
   -------------------------------------------------------------------------- */

/* Ensure root element covers the entire screen including safe areas */
#root {
  /* This prevents content from being obscured under the status bar */
  min-height: 100dvh;
}

/* Global class helper for pages that want top safe area on their own header */
.safe-top {
  padding-top: env(safe-area-inset-top);
}

/* Global class helper for bottom (above home indicator) */
.safe-bottom {
  padding-bottom: env(safe-area-inset-bottom);
}


/* Footer Styles */
.footer {
  background-color: #1e293b;
  color: #f8fafc;
  padding: 4rem 0 0;
  margin-top: auto;
}

.footer-content {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 3rem;
  margin-bottom: 3rem;
}

.footer-brand .logo-icon {
  font-size: 2rem;
  margin-right: 0.5rem;
}

.footer-brand p {
  margin-top: 1rem;
  color: #94a3b8;
  max-width: 300px;
}

.footer-links {
  display: flex;
  justify-content: space-around;
}

.link-group h4 {
  color: white;
  margin-bottom: 1.5rem;
  font-size: 1.1rem;
}

.link-group a {
  display: block;
  color: #94a3b8;
  margin-bottom: 0.75rem;
  transition: color 0.2s;
}

.link-group a:hover {
  color: var(--color-primary-light);
}

.footer-bottom {
  text-align: center;
  padding: 1.5rem 0;
  border-top: 1px solid #334155;
  color: #64748b;
  font-size: 0.9rem;
}

@media (max-width: 768px) {
  .footer-content {
    grid-template-columns: 1fr;
    gap: 2rem;
  }

  .footer-links {
    flex-direction: column;
    gap: 2rem;
    justify-content: flex-start;
  }
